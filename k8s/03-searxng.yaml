apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: agenticseeek
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: docker.io/searxng/searxng:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SEARXNG_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: agenticseeek-config
              key: SEARXNG_BASE_URL
        - name: SEARXNG_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: agenticseeek-secrets
              key: SEARXNG_SECRET_KEY
        - name: UWSGI_WORKERS
          valueFrom:
            configMapKeyRef:
              name: agenticseeek-config
              key: UWSGI_WORKERS
        - name: UWSGI_THREADS
          valueFrom:
            configMapKeyRef:
              name: agenticseeek-config
              key: UWSGI_THREADS
        volumeMounts:
        - name: searxng-config
          mountPath: /etc/searxng
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
        securityContext:
          capabilities:
            add:
            - CHOWN
            - SETGID
            - SETUID
          allowPrivilegeEscalation: true
      volumes:
      - name: searxng-config
        persistentVolumeClaim:
          claimName: searxng-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  namespace: agenticseeek
  labels:
    app: searxng
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: searxng
